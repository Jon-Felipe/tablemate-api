name: TableMate API CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: 'tablemate-ci-only-test-secret-not-for-production'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
